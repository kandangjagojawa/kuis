<!DOCTYPE html>
<html lang="jv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Maca Aksara Jawa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1 id="ui-title" class="aksara-jawa"></h1>
    <div class="paugeran-selector">
      <label for="paugeranSelect" id="ui-label-paugeran" class="aksara-jawa"></label>
      <select id="paugeranSelect" class="aksara-jawa">
        <option value="kbj" selected></option>
        <option value="sriwedari"></option>
        <option value="kawi"></option>
      </select>
    </div>
  </header>

  <main class="container">
    <section class="story-card">
      <h2 id="story-title" class="aksara-jawa"></h2>
      <article id="story-content" class="aksara-jawa story-text"></article>
    </section>

    <section class="questions-card">
      <h3 id="ui-questions-title" class="aksara-jawa"></h3>
      <div id="questions-container"></div>

      <div class="navigation-area">
        <button id="next-story-btn" class="aksara-jawa btn" style="display: none;"></button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
