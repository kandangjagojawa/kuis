<!DOCTYPE html>
<html lang="jv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crita Aksara Jawa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1 id="ui-title" class="aksara-jawa"></h1>
    <div class="header-controls">
      <div class="story-selector">
        <label for="storySelect" id="ui-label-story" class="aksara-jawa"></label>
        <select id="storySelect"></select>
      </div>
      <div class="paugeran-selector">
        <span id="ui-label-paugeran" class="aksara-jawa"></span>
        <div class="paugeran-options">
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="kbj" checked>
            <span>Paugeran KBJ</span>
          </label>
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="sriwedari">
            <span>Paugeran Sriwedari</span>
          </label>
          <label class="paugeran-option">
            <input type="radio" name="paugeran" value="kawi">
            <span>Cara Kawi (Mardi Kawi)</span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="story-card">
      <h2 id="story-title" class="aksara-jawa"></h2>
      <article id="story-content" class="aksara-jawa story-text"></article>
    </section>

    <section class="questions-card">
      <h3 id="ui-questions-title" class="aksara-jawa"></h3>
      <div id="questions-container"></div>

      <div class="navigation-area">
        <button id="next-story-btn" class="aksara-jawa btn" style="display: none;"></button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
